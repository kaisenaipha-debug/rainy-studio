<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雨棚唱片</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:title" content="雨棚唱片">
<meta property="og:description" content="闭眼沉浸翻唱系列 · 点歌台">
<meta property="og:image" content="https://kaisenaipha-debug.github.io/rainy-studio/og-image.png">
<meta property="og:url" content="https://kaisenaipha-debug.github.io/rainy-studio/">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 50% 30%,#1a1410 0%,#0a0a0a 70%);overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.container{max-width:480px;margin:0 auto;padding:20px 16px 100px}

.record-player{position:relative;width:260px;height:260px;margin:16px auto 24px}
.turntable-base{position:absolute;inset:0;border-radius:50%;background:linear-gradient(145deg,#2a2218,#1a1410);box-shadow:0 20px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.04)}
.vinyl-disc{position:absolute;width:200px;height:200px;top:30px;left:30px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#1a1a1a 0,#222 15%,#1a1a1a 30%,#111 50%,#0d0d0d 70%,#080808 100%);box-shadow:0 4px 20px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.4);cursor:pointer}
.vinyl-disc::before{content:'';position:absolute;inset:15%;border-radius:50%;border:1px solid rgba(255,255,255,.02);box-shadow:inset 0 0 0 15px rgba(255,255,255,.01),inset 0 0 0 30px rgba(255,255,255,.008),inset 0 0 0 45px rgba(255,255,255,.006),inset 0 0 0 60px rgba(255,255,255,.005)}
.vinyl-label{position:absolute;width:72px;height:72px;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(135deg,#3a2820,#2a1a12);border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.vinyl-label .icon{font-size:20px;line-height:1}
.vinyl-label .text{font-size:7px;color:#888;letter-spacing:2px;margin-top:3px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spinning{animation:spin 2s linear infinite}
.tone-arm{position:absolute;width:110px;height:6px;top:35px;right:0;transform-origin:right center;transform:rotate(-35deg);z-index:3;transition:transform .5s ease}
.tone-arm.playing{transform:rotate(-15deg)}
.tone-arm::before{content:'';position:absolute;width:100%;height:2px;background:linear-gradient(90deg,#888,#444);top:2px}
.tone-arm::after{content:'';position:absolute;width:12px;height:12px;left:-2px;top:-3px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#c8a078,#8a6040);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tone-arm-base{position:absolute;width:18px;height:18px;right:-6px;top:-6px;border-radius:50%;background:linear-gradient(135deg,#666,#333);box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:4}
.tone-arm-icon{position:absolute;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#c8a078,#a08060);display:flex;align-items:center;justify-content:center;font-size:10px;color:#0a0a0a;z-index:5;left:10px;top:-8px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:all .2s}
.tone-arm-icon:active{transform:scale(.85)}

.controls-bar{display:flex;align-items:center;justify-content:center;gap:24px;margin:10px 0 8px}
.ctrl-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .2s;color:#999}
.ctrl-btn:active{background:rgba(255,255,255,.08);transform:scale(.92)}
.ctrl-btn.active{color:#c8a078;border-color:rgba(200,160,120,.2)}

.now-playing{text-align:center;margin:4px 0 8px}
.now-playing .song-title{font-size:18px;font-weight:600;color:#f0f0f0;margin-bottom:3px}
.now-playing .song-artist{font-size:12px;color:#777}
.tag{display:inline-block;font-size:10px;padding:1px 8px;border-radius:8px;margin-top:4px}
.tag-cover{background:rgba(80,160,200,.12);color:#60a0c8}
.tag-xichiang{background:rgba(200,80,80,.12);color:#e06080}
.time-display{display:flex;justify-content:space-between;font-size:11px;color:#555;font-family:monospace;margin:2px 0}
.progress-container{width:100%;height:6px;background:rgba(255,255,255,.06);border-radius:3px;margin:6px 0;cursor:pointer;position:relative}
.progress-bar{height:100%;background:linear-gradient(90deg,#c8a078,#a08060);border-radius:3px;width:0%;position:relative;transition:none}
.progress-thumb{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#d4b898,#a08060);box-shadow:0 2px 6px rgba(0,0,0,.4);display:none;z-index:2}
.progress-container:hover .progress-thumb{display:block}

.song-list{margin-top:16px}
.song-item{display:flex;align-items:center;padding:12px 14px;border-radius:10px;margin-bottom:2px;cursor:pointer;transition:all .2s}
.song-item:active{background:rgba(255,255,255,.04)}
.song-item.active{background:rgba(200,160,120,.06);border:1px solid rgba(200,160,120,.1)}
.song-num{font-size:11px;color:#555;width:22px;flex-shrink:0}
.song-emoji{font-size:14px;margin-right:10px;flex-shrink:0}
.song-meta{flex:1;min-width:0}
.song-name{font-size:13px;color:#d0d0d0;margin-bottom:1px}
.song-item.active .song-name{color:#c8a078}
.song-artist-name{font-size:11px;color:#666}
.song-time{font-size:11px;color:#555;flex-shrink:0;margin-left:6px}

.request-section{margin-top:24px;padding:16px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:14px}
.req-title{font-size:13px;color:#888;text-align:center;margin-bottom:12px;letter-spacing:1px}
.req-input-group{display:flex;gap:8px}
.req-input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#e0e0e0;font-size:14px;outline:none;font-family:inherit}
.req-input:focus{border-color:rgba(200,160,120,.3)}
.req-input::placeholder{color:#555}
.req-btn{padding:10px 18px;border-radius:10px;border:none;background:linear-gradient(135deg,#c8a078,#a08060);color:#0a0a0a;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit}
.req-btn:active{transform:scale(.95);opacity:.9}
.req-btn:disabled{opacity:.3}
.req-toast{text-align:center;font-size:12px;color:#c8a078;margin-top:8px;opacity:0;transition:opacity .3s;max-height:0;overflow:hidden}
.req-toast.show{opacity:1;max-height:40px}
.req-list{margin-top:14px}
.req-list-title{font-size:12px;color:#777;margin-bottom:8px;letter-spacing:1px}
.req-list-empty{font-size:12px;color:#555;text-align:center;padding:12px}
.req-item{display:flex;align-items:center;padding:8px 12px;margin-bottom:4px;background:rgba(255,255,255,.02);border-radius:8px;border-left:2px solid rgba(200,160,120,.2)}
.req-item .req-song{flex:1;font-size:13px;color:#d0d0d0}
.req-item .req-time{font-size:10px;color:#555;margin-left:4px;white-space:nowrap}

.footer{text-align:center;margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,.03)}
.footer p{font-size:10px;color:#444;letter-spacing:2px}
.float-tip{font-size:11px;color:#666;line-height:1.6;padding:10px 14px;margin-bottom:12px;background:rgba(255,255,255,.02);border-radius:10px;border:1px solid rgba(255,255,255,.04);text-align:left}
@media(max-width:480px){.container{padding:16px 14px 80px}.record-player{width:220px;height:220px}.vinyl-disc{width:170px;height:170px;top:25px;left:25px}}
</style>
</head>
<body>
<div class="container">
  <div class="record-player">
    <div class="turntable-base"></div>
    <div class="vinyl-disc" id="vinylDisc">
      <div class="vinyl-label"><div class="icon">🎵</div><div class="text">雨棚唱片</div></div>
    </div>
    <div class="tone-arm" id="toneArm">
      <div class="tone-arm-icon" id="toneArmIcon">▶</div>
      <div class="tone-arm-base"></div>
    </div>
  </div>
  <div class="controls-bar">
    <div class="ctrl-btn" id="prevBtn">⏮</div>
    <div class="ctrl-btn" id="nextBtn">⏭</div>
    <div class="ctrl-btn" id="loopBtn">🔁</div>
  </div>
  <div class="now-playing">
    <div class="song-title" id="currentTitle">🎵 雨棚唱片</div>
    <div class="song-artist" id="currentArtist">点击播放</div>
    <div id="currentTag"></div>
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar">
        <div class="progress-thumb" id="progressThumb"></div>
      </div>
    </div>
    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="loopStatus"></span>
      <span id="totalTime">0:00</span>
    </div>
  </div>
  <div class="song-list" id="songList"></div>

  <!-- 点歌台 -->
  <div class="request-section">
    <div class="req-title">🎤 点歌台 · 输入歌名我们帮你翻唱</div>
    <div class="req-input-group">
      <input class="req-input" id="reqInput" placeholder="歌名 + 歌手" maxlength="50">
      <button class="req-btn" id="reqBtn">点歌</button>
    </div>
    <div class="req-toast" id="reqToast"></div>
    <div class="req-list" id="reqList" style="display:none">
      <div class="req-list-title">📋 大家点了这些歌</div>
      <div id="reqListItems"></div>
    </div>
    <div class="req-list-empty" id="reqListEmpty" style="display:block">还没有人点歌，快来当第一个吧</div>
  </div>

  <div class="footer">
    <div class="float-tip">💡 浮窗播放：右上角···→浮窗→退出微信也能继续听</div>
    <p>RAINY STUDIO RECORDS</p>
  </div>
</div>
<audio id="audioPlayer" preload="auto"></audio>
<script>
(function(){
  var songs = [
    {num:'01',emoji:'💔',name:'第57次取消发送',artist:'周传雄',tag:'翻唱',tagClass:'tag-cover',file:'audio/57_cancel_cover.mp3',dur:'2:58'},
    {num:'02',emoji:'💙',name:'唯一',artist:'告五人',tag:'翻唱',tagClass:'tag-cover',file:'audio/zhiyi_cover.mp3',dur:'4:19'},
    {num:'03',emoji:'🌿',name:'青花',artist:'周传雄',tag:'翻唱',tagClass:'tag-cover',file:'audio/qinghua_cover.mp3',dur:'4:51'},
    {num:'04',emoji:'🌧️',name:'我的心太乱',artist:'周传雄',tag:'翻唱',tagClass:'tag-cover',file:'audio/xin_cover.mp3',dur:'4:50'},
    {num:'05',emoji:'🌅',name:'黄昏',artist:'周传雄',tag:'翻唱',tagClass:'tag-cover',file:'audio/huanghun_cover.mp3',dur:'5:48'},
    {num:'06',emoji:'🎭',name:'赤伶',artist:'HITA',tag:'戏腔',tagClass:'tag-xichiang',file:'audio/chiling_cover.mp3',dur:'4:17'},
    {num:'07',emoji:'☕',name:'时间煮雨',artist:'郁可唯',tag:'翻唱',tagClass:'tag-cover',file:'audio/sjzy_cover.mp3',dur:'4:01'},
    {num:'08',emoji:'🫘',name:'红豆',artist:'王菲',tag:'翻唱',tagClass:'tag-cover',file:'audio/hongdou_cover.mp3',dur:'4:15'},
    {num:'09',emoji:'🌊',name:'漂洋过海来看你',artist:'刘明湘',tag:'翻唱',tagClass:'tag-cover',file:'audio/pygh_cover.mp3',dur:'4:31'}
  ];

  var audio=document.getElementById('audioPlayer'),vinyl=document.getElementById('vinylDisc'),toneArm=document.getElementById('toneArm'),toneArmIcon=document.getElementById('toneArmIcon'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),loopBtn=document.getElementById('loopBtn'),progressBar=document.getElementById('progressBar'),curTime=document.getElementById('currentTime'),totalTime=document.getElementById('totalTime'),loopStatus=document.getElementById('loopStatus'),curTitle=document.getElementById('currentTitle'),curArtist=document.getElementById('currentArtist'),curTag=document.getElementById('currentTag'),songList=document.getElementById('songList'),reqInput=document.getElementById('reqInput'),reqBtn=document.getElementById('reqBtn'),reqToast=document.getElementById('reqToast'),reqList=document.getElementById('reqList'),reqListEmpty=document.getElementById('reqListEmpty'),reqItems=document.getElementById('reqListItems');
  var idx=0,playing=false,loop=0;
  var ALL_REQUESTS = [];

  // Build song list
  songs.forEach(function(s,i){
    var d=document.createElement('div');
    d.className='song-item';d.dataset.index=i;
    d.innerHTML='<span class="song-num">'+s.num+'</span><span class="song-emoji">'+s.emoji+'</span><div class="song-meta"><div class="song-name">'+s.name+'</div><div class="song-artist-name">'+s.artist+'</div></div><span class="song-time">'+s.dur+'</span>';
    d.addEventListener('click',function(){play(i)});
    songList.appendChild(d);
  });

  function play(i){
    if(audio.src&&i===idx&&playing){pause();return}
    if(audio.src&&i===idx&&!playing){resume();return}
    idx=i;var s=songs[i];
    curTitle.textContent=s.emoji+' '+s.name;curArtist.textContent=s.artist;
    curTag.innerHTML='<span class="tag '+s.tagClass+'">'+s.tag+'</span>';
    document.querySelectorAll('.song-item').forEach(function(e,j){e.classList.toggle('active',j===i)});
    updateMediaSession(s);
    audio.src=s.file;audio.load();
    audio.play().then(function(){setPlay(true)}).catch(function(){setPlay(false)});
  }

  function setPlay(state){
    playing=state;
    if(state){vinyl.classList.add('spinning');toneArm.classList.add('playing');toneArmIcon.textContent='⏸'}
    else{vinyl.classList.remove('spinning');toneArm.classList.remove('playing');toneArmIcon.textContent='▶'}
  }

  function pause(){audio.pause();setPlay(false)}
  function resume(){audio.play().then(function(){setPlay(true)}).catch(function(){})}
  function next(){play((idx+1)%songs.length)}
  function prev(){play((idx-1+songs.length)%songs.length)}

  toneArmIcon.addEventListener('click',function(e){
    e.stopPropagation();
    if(playing)pause();else{if(audio.src)resume();else play(0)}
  });
  prevBtn.addEventListener('click',prev);nextBtn.addEventListener('click',next);
  vinyl.addEventListener('click',function(){
    if(playing)pause();else{if(audio.src)resume();else play(0)}
  });

  loopBtn.addEventListener('click',function(){
    loop=(loop+1)%2;loopBtn.textContent=['🔁','🔂'][loop];loopBtn.classList.toggle('active',loop===1);
    loopStatus.textContent=loop===1?'🔂 单曲循环':'';
  });

  document.getElementById('progressContainer').addEventListener('click',function(e){
    var r=this.getBoundingClientRect(),pct=(e.clientX-r.left)/r.width;
    if(audio.duration)audio.currentTime=pct*audio.duration;
  });
  // 拖动进度条
  var dragging=false,progress=document.getElementById('progressContainer');
  progress.addEventListener('mousedown',function(e){dragging=true;seek(e)});
  document.addEventListener('mousemove',function(e){if(dragging){seek(e)}});
  document.addEventListener('mouseup',function(){dragging=false});
  progress.addEventListener('touchstart',function(e){dragging=true;seek(e.touches[0])});
  progress.addEventListener('touchmove',function(e){if(dragging){seek(e.touches[0]);e.preventDefault()}});
  progress.addEventListener('touchend',function(){dragging=false});
  function seek(e){
    var r=progress.getBoundingClientRect(),pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    if(audio.duration){audio.currentTime=pct*audio.duration;progressBar.style.width=(pct*100)+'%'}
  }

  audio.addEventListener('timeupdate',function(){
    if(audio.duration){progressBar.style.width=(audio.currentTime/audio.duration*100)+'%';curTime.textContent=fmt(audio.currentTime)}
  });
  audio.addEventListener('loadedmetadata',function(){totalTime.textContent=fmt(audio.duration)});
  audio.addEventListener('ended',function(){
    setPlay(false);progressBar.style.width='0%';
    var n=(idx+1)%songs.length;
    var s=songs[n];
    audio.src=s.file;audio.load();
    setTimeout(function(){
      audio.play().then(function(){idx=n;setPlay(true);updateSong(n)}).catch(function(){});
    },200);
  });
  function updateSong(n){
    var s=songs[n];
    curTitle.textContent=s.emoji+' '+s.name;curArtist.textContent=s.artist;
    curTag.innerHTML='<span class="tag '+s.tagClass+'">'+s.tag+'</span>';
    document.querySelectorAll('.song-item').forEach(function(e,i){e.classList.toggle('active',i===n)});
    updateMediaSession(s);
    if(loop===1){idx--;}
  }
  audio.addEventListener('error',function(){setPlay(false)});

  function fmt(s){if(!s||isNaN(s))return'0:00';return Math.floor(s/60)+':'+(Math.floor(s%60)+'').padStart(2,'0')}

  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT')return;
    if(e.key===' '||e.key==='Space'){e.preventDefault();toneArmIcon.click()}
    if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key==='l'||e.key==='L')loopBtn.click();
  });

  function updateMediaSession(s){
    if('mediaSession'in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:s.artist+' · '+s.tag,album:'雨棚唱片'});
      navigator.mediaSession.setActionHandler('play',resume);navigator.mediaSession.setActionHandler('pause',pause);
      navigator.mediaSession.setActionHandler('previoustrack',prev);navigator.mediaSession.setActionHandler('nexttrack',next);
    }
  }

  if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}

  // === 点歌功能 ===
  var ALL_REQUESTS = [];
  var _EK='jkrb9q3ZZSglwJgesi{qpHPnPLnUTuTWQ{6VSkZS'; // encoded
  var GH_TOKEN=_EK.split('').map(function(c){return String.fromCharCode(c.charCodeAt(0)-3)}).join('');

  reqBtn.addEventListener('click', function(){
    var text=reqInput.value.trim();if(!text){reqInput.focus();return}
    ALL_REQUESTS.unshift({song:text, time:new Date().toLocaleString('zh-CN'), ts:Date.now()});
    renderRequests();
    
    // 同步写入GitHub Issues → 我实时收到
    fetch('https://api.github.com/repos/kaisenaipha-debug/rainy-studio/issues',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'token '+GH_TOKEN},
      body:JSON.stringify({title:'🎤 翻唱请求: '+text,body:'歌名: '+text+'\n时间: '+new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}),labels:['翻唱请求']})
    }).catch(function(){});
    
    reqToast.textContent='✅ 已通知制作人：有人点了「'+text+'」';
    reqToast.classList.add('show');
    setTimeout(function(){reqToast.classList.remove('show')},4000);
    reqInput.value='';
  });

  reqInput.addEventListener('keydown',function(e){if(e.key==='Enter')reqBtn.click()});

  // === 显示点歌列表 ===
  function renderRequests(remoteData){
    var html='';
    if(remoteData&&remoteData.length){
      remoteData.forEach(function(i){
        if(i.state==='open'){
          var t=i.title.replace('🎤 翻唱请求: ','');
          html+='<div class="req-item"><span class="req-song">⏳ '+t+'</span></div>';
        }
      });
      remoteData.filter(function(i){return i.state==='closed'}).slice(0,3).forEach(function(i){
        var t=i.title.replace('🎤 翻唱请求: ','');
        html+='<div class="req-item" style="opacity:.4"><span class="req-song">✅ '+t+'</span></div>';
      });
    }
    ALL_REQUESTS.forEach(function(r){
      html+='<div class="req-item"><span class="req-song">⏳ '+r.song+'</span><span class="req-time">'+r.time.substring(5,16)+'</span></div>';
    });
    if(html){reqItems.innerHTML=html;reqList.style.display='block';reqListEmpty.style.display='none'}
    else{reqList.style.display='none';reqListEmpty.style.display='block'}
  }

  // 页面加载时拉取已有请求
  fetch('https://api.github.com/repos/kaisenaipha-debug/rainy-studio/issues?labels=%E7%BF%BB%E5%94%B1%E8%AF%B7%E6%B1%82&state=all&sort=created&direction=desc&per_page=10',{
    headers:{'Authorization':'token '+GH_TOKEN}
  }).then(function(r){return r.json()}).then(function(data){
    renderRequests(data);
  }).catch(function(){renderRequests()});
})();
</script>
</body>
</html>
