<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雨棚唱片</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:title" content="雨棚唱片">
<meta property="og:description" content="闭眼沉浸翻唱系列 · 点歌台">
<meta property="og:image" content="https://kaisenaipha-debug.github.io/rainy-studio/og-image.png">
<meta property="og:url" content="https://kaisenaipha-debug.github.io/rainy-studio/">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a; color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  min-height: 100vh;
  background-image: radial-gradient(ellipse at 50% 30%, #1a1410 0%, #0a0a0a 70%);
  overflow-x: hidden; -webkit-tap-highlight-color: transparent; user-select: none;
}
.container { max-width: 480px; margin: 0 auto; padding: 20px 16px 100px; }

/* Record Player */
.record-player { position: relative; width: 260px; height: 260px; margin: 16px auto 24px; }
.turntable-base { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(145deg, #2a2218, #1a1410); box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.04); }
.vinyl-disc { position: absolute; width: 200px; height: 200px; top: 30px; left: 30px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #222 15%, #1a1a1a 30%, #111 50%, #0d0d0d 70%, #080808 100%); box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.4); cursor: pointer; transition: transform 0.3s; }
.vinyl-disc::before { content: ''; position: absolute; inset: 15%; border-radius: 50%; border: 1px solid rgba(255,255,255,0.02); box-shadow: inset 0 0 0 15px rgba(255,255,255,0.01), inset 0 0 0 30px rgba(255,255,255,0.008), inset 0 0 0 45px rgba(255,255,255,0.006), inset 0 0 0 60px rgba(255,255,255,0.005); }
.vinyl-label { position: absolute; width: 72px; height: 72px; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; background: linear-gradient(135deg, #3a2820, #2a1a12); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 2; }
.vinyl-label .icon { font-size: 20px; line-height: 1; }
.vinyl-label .text { font-size: 7px; color: #888; letter-spacing: 2px; margin-top: 3px; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.spinning { animation: spin 2s linear infinite; }
.tone-arm { position: absolute; width: 110px; height: 6px; top: 35px; right: 0px; transform-origin: right center; transform: rotate(-35deg); z-index: 3; transition: transform 0.5s ease; }
.tone-arm.playing { transform: rotate(-15deg); }
.tone-arm::before { content: ''; position: absolute; width: 100%; height: 2px; background: linear-gradient(90deg, #888, #444); top: 2px; }
.tone-arm::after { content: ''; position: absolute; width: 12px; height: 12px; left: -2px; top: -3px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #c8a078, #8a6040); box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
.tone-arm-base { position: absolute; width: 18px; height: 18px; right: -6px; top: -6px; border-radius: 50%; background: linear-gradient(135deg, #666, #333); box-shadow: 0 2px 8px rgba(0,0,0,0.5); z-index: 4; }
.tone-arm-icon {
  position: absolute; width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, #c8a078, #a08060);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #0a0a0a; z-index: 5;
  left: 10px; top: -8px; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.tone-arm-icon:active { transform: scale(0.85); }

/* Controls bar - no play button */
.controls-bar { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 10px 0 8px; }
.ctrl-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; cursor: pointer; transition: all 0.2s; color: #999;
  -webkit-tap-highlight-color: transparent;
}
.ctrl-btn:active { background: rgba(255,255,255,0.08); transform: scale(0.92); }
.ctrl-btn.active { color: #c8a078; border-color: rgba(200,160,120,0.2); }

/* Now Playing */
.now-playing { text-align: center; margin: 4px 0 8px; }
.now-playing .song-title { font-size: 18px; font-weight: 600; color: #f0f0f0; margin-bottom: 3px; }
.now-playing .song-artist { font-size: 12px; color: #777; }
.tag { display: inline-block; font-size: 10px; padding: 1px 8px; border-radius: 8px; margin-top: 4px; }
.tag-cover { background: rgba(80,160,200,0.12); color: #60a0c8; }
.tag-xichiang { background: rgba(200,80,80,0.12); color: #e06080; }
.time-display { display: flex; justify-content: space-between; font-size: 11px; color: #555; font-family: monospace; margin: 2px 0; }
.progress-container { width: 100%; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; margin: 4px 0; cursor: pointer; position: relative; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #c8a078, #a08060); border-radius: 2px; width: 0%; transition: width 0.3s linear; }

/* Song List */
.song-list { margin-top: 16px; }
.song-item { display: flex; align-items: center; padding: 12px 14px; border-radius: 10px; margin-bottom: 2px; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
.song-item:active { background: rgba(255,255,255,0.04); }
.song-item.active { background: rgba(200,160,120,0.06); border: 1px solid rgba(200,160,120,0.1); }
.song-num { font-size: 11px; color: #555; width: 22px; flex-shrink: 0; }
.song-emoji { font-size: 14px; margin-right: 10px; flex-shrink: 0; }
.song-meta { flex: 1; min-width: 0; }
.song-name { font-size: 13px; color: #d0d0d0; margin-bottom: 1px; }
.song-item.active .song-name { color: #c8a078; }
.song-artist-name { font-size: 11px; color: #666; }
.song-time { font-size: 11px; color: #555; flex-shrink: 0; margin-left: 6px; }

/* Request Section */
.request-section {
  margin-top: 24px; padding: 16px; background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 14px;
}
.request-section .req-title { font-size: 13px; color: #888; text-align: center; margin-bottom: 12px; letter-spacing: 1px; }
.req-input-group { display: flex; gap: 8px; }
.req-input {
  flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03); color: #e0e0e0; font-size: 14px; outline: none;
  font-family: inherit; transition: border-color 0.2s;
}
.req-input:focus { border-color: rgba(200,160,120,0.3); }
.req-input::placeholder { color: #555; }
.req-btn {
  padding: 10px 18px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, #c8a078, #a08060); color: #0a0a0a;
  font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: all 0.2s; font-family: inherit;
}
.req-btn:active { transform: scale(0.95); opacity: 0.9; }
.req-btn:disabled { opacity: 0.3; }
.req-toast {
  text-align: center; font-size: 12px; color: #c8a078; margin-top: 10px;
  opacity: 0; transition: opacity 0.3s; max-height: 0; overflow: hidden;
}
.req-toast.show { opacity: 1; max-height: 40px; }

.footer { text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.03); }
.footer p { font-size: 10px; color: #444; letter-spacing: 2px; }
.float-tip { font-size: 11px; color: #666; line-height: 1.6; padding: 10px 14px; margin-bottom: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); text-align: left; }

@media (max-width: 480px) {
  .container { padding: 16px 14px 80px; }
  .record-player { width: 220px; height: 220px; }
  .vinyl-disc { width: 170px; height: 170px; top: 25px; left: 25px; }
}
</style>
</head>
<body>
<div class="container">

  <!-- Record Player -->
  <div class="record-player">
    <div class="turntable-base"></div>
    <div class="vinyl-disc" id="vinylDisc">
      <div class="vinyl-label"><div class="icon">🎵</div><div class="text">雨棚唱片</div></div>
    </div>
    <div class="tone-arm" id="toneArm">
      <div class="tone-arm-icon" id="toneArmIcon">▶</div>
      <div class="tone-arm-base"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="ctrl-btn" id="prevBtn">⏮</div>
    <div class="ctrl-btn" id="nextBtn">⏭</div>
    <div class="ctrl-btn" id="loopBtn" title="循环模式">🔁</div>
  </div>

  <!-- Now Playing -->
  <div class="now-playing">
    <div class="song-title" id="currentTitle">🎵 雨棚唱片</div>
    <div class="song-artist" id="currentArtist">点击播放</div>
    <div id="currentTag"></div>
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="time-display">
      <span id="currentTime">0:00</span>
      <span id="loopStatus"></span>
      <span id="totalTime">0:00</span>
    </div>
  </div>

  <!-- Song List -->
  <div class="song-list" id="songList"></div>

  <!-- Request Song -->
  <div class="request-section">
    <div class="req-title">🎤 点歌台 · 输入歌名翻唱</div>
    <div class="req-input-group">
      <input class="req-input" id="reqInput" placeholder="歌名 + 歌手（如：黄昏 周传雄）" maxlength="50">
      <button class="req-btn" id="reqBtn">点歌</button>
    </div>
    <div class="req-toast" id="reqToast">✅ 翻唱请求已发出！制作人收到后尽快完成</div>
  </div>

  <div class="footer">
    <div class="float-tip">💡 浮窗播放：右上角···→浮窗→退出微信也能继续听</div>
    <p>RAINY STUDIO RECORDS</p>
  </div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
(function() {
  var songs = [
    { num:'01', emoji:'💔', name:'第57次取消发送', artist:'周传雄', tag:'翻唱', tagClass:'tag-cover', file:'audio/57_cancel_cover.mp3', dur:'2:58' },
    { num:'02', emoji:'💙', name:'唯一', artist:'告五人', tag:'翻唱', tagClass:'tag-cover', file:'audio/zhiyi_cover.mp3', dur:'4:19' },
    { num:'03', emoji:'🌿', name:'青花', artist:'周传雄', tag:'翻唱', tagClass:'tag-cover', file:'audio/qinghua_cover.mp3', dur:'4:51' },
    { num:'04', emoji:'🌧️', name:'我的心太乱', artist:'周传雄', tag:'翻唱', tagClass:'tag-cover', file:'audio/xin_cover.mp3', dur:'4:50' },
    { num:'05', emoji:'🌅', name:'黄昏', artist:'周传雄', tag:'翻唱', tagClass:'tag-cover', file:'audio/huanghun_cover.mp3', dur:'5:48' },
    { num:'06', emoji:'🎭', name:'赤伶', artist:'HITA', tag:'戏腔', tagClass:'tag-xichiang', file:'audio/chiling_cover.mp3', dur:'4:17' },
    { num:'07', emoji:'☕', name:'时间煮雨', artist:'郁可唯', tag:'翻唱', tagClass:'tag-cover', file:'audio/sjzy_cover.mp3', dur:'4:01' }
  ];

  var audio = document.getElementById('audioPlayer');
  var vinyl = document.getElementById('vinylDisc');
  var toneArm = document.getElementById('toneArm');
  var toneArmIcon = document.getElementById('toneArmIcon');
  var GH_TOKEN = 'gho_Jp2YztI3XHZDv2t9mORz0tPL8cDCX0o';
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var loopBtn = document.getElementById('loopBtn');
  var progressBar = document.getElementById('progressBar');
  var currentTime = document.getElementById('currentTime');
  var totalTime = document.getElementById('totalTime');
  var loopStatus = document.getElementById('loopStatus');
  var currentTitle = document.getElementById('currentTitle');
  var currentArtist = document.getElementById('currentArtist');
  var currentTag = document.getElementById('currentTag');
  var songList = document.getElementById('songList');
  var reqInput = document.getElementById('reqInput');
  var reqBtn = document.getElementById('reqBtn');
  var reqToast = document.getElementById('reqToast');

  var currentIndex = 0, isPlaying = false, loopMode = 0; // 0=列表循环, 1=单曲循环
  var loopIcons = ['🔁', '🔂'];

  // Build song list
  songs.forEach(function(s, i) {
    var d = document.createElement('div');
    d.className = 'song-item'; d.dataset.index = i;
    d.innerHTML = '<span class="song-num">'+s.num+'</span><span class="song-emoji">'+s.emoji+'</span><div class="song-meta"><div class="song-name">'+s.name+'</div><div class="song-artist-name">'+s.artist+'</div></div><span class="song-time">'+s.dur+'</span>';
    d.addEventListener('click', function(){ playSong(i); });
    songList.appendChild(d);
  });

  function playSong(idx) {
    if (idx === currentIndex && isPlaying) { pause(); return; }
    if (idx === currentIndex && !isPlaying) { resume(); return; }
    currentIndex = idx;
    var s = songs[idx];
    
    currentTitle.textContent = s.emoji + ' ' + s.name;
    currentArtist.textContent = s.artist;
    currentTag.innerHTML = '<span class="tag '+s.tagClass+'">'+s.tag+'</span>';
    
    document.querySelectorAll('.song-item').forEach(function(el, i){
      el.classList.toggle('active', i === idx);
    });
    
    updateMediaSession(s);
    audio.src = s.file; audio.load();
    audio.play().then(function(){ setPlaying(true); }).catch(function(){ setPlaying(false); });
  }

  function setPlaying(state) {
    isPlaying = state;
    if (state) { vinyl.classList.add('spinning'); toneArm.classList.add('playing'); toneArmIcon.textContent = '⏸'; }
    else { vinyl.classList.remove('spinning'); toneArm.classList.remove('playing'); toneArmIcon.textContent = '▶'; }
  }

  function pause() { audio.pause(); setPlaying(false); }
  function resume() { audio.play().then(function(){ setPlaying(true); }).catch(function(){}); }
  function next() { playSong((currentIndex + 1) % songs.length); }
  function prev() { playSong((currentIndex - 1 + songs.length) % songs.length); }

  // Tone arm click = play/pause
  toneArmIcon.addEventListener('click', function(e){
    e.stopPropagation();
    if (isPlaying) pause();
    else { if (audio.src) resume(); else playSong(0); }
  });
  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  // Vinyl click also play/pause
  vinyl.addEventListener('click', function(){
    if (isPlaying) pause();
    else { if (audio.src) resume(); else playSong(0); }
  });

  // Loop toggle
  loopBtn.addEventListener('click', function(){
    loopMode = (loopMode + 1) % 2;
    loopBtn.textContent = loopIcons[loopMode];
    loopBtn.classList.toggle('active', loopMode === 1);
    updateLoopStatus();
  });

  function updateLoopStatus() {
    loopStatus.textContent = loopMode === 1 ? '🔂 单曲循环' : '';
  }

  // Progress
  document.getElementById('progressContainer').addEventListener('click', function(e){
    var rect = this.getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
  });

  audio.addEventListener('timeupdate', function(){
    if (audio.duration) {
      progressBar.style.width = (audio.currentTime / audio.duration * 100) + '%';
      currentTime.textContent = formatTime(audio.currentTime);
    }
  });
  audio.addEventListener('loadedmetadata', function(){ totalTime.textContent = formatTime(audio.duration); });
  audio.addEventListener('ended', function(){
    setPlaying(false); progressBar.style.width = '0%';
    if (loopMode === 1) { playSong(currentIndex); }
    else { next(); }
  });
  audio.addEventListener('error', function(){ setPlaying(false); });

  function formatTime(s) {
    if (!s || isNaN(s)) return '0:00';
    return Math.floor(s/60) + ':' + (Math.floor(s%60)+'').padStart(2,'0');
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', function(e){
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); toneArmIcon.click(); }
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'l' || e.key === 'L') loopBtn.click();
  });

  // Media Session
  function updateMediaSession(song) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: song.name, artist: song.artist + ' · ' + song.tag, album: '雨棚唱片'
      });
      navigator.mediaSession.setActionHandler('play', function(){ resume(); });
      navigator.mediaSession.setActionHandler('pause', function(){ pause(); });
      navigator.mediaSession.setActionHandler('previoustrack', prev);
      navigator.mediaSession.setActionHandler('nexttrack', next);
    }
  }

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  // === 点歌功能 - GitHub Issues 数据互通 ===
  reqBtn.addEventListener('click', function(){
    var text = reqInput.value.trim();
    if (!text) { reqInput.focus(); return; }
    reqBtn.disabled = true; reqBtn.textContent = '发送中...';
    
    // 写入 GitHub Issues → 我实时可查
    fetch('https://api.github.com/repos/kaisenaipha-debug/rainy-studio/issues', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'token ' + GH_TOKEN},
      body: JSON.stringify({
        title: '🎤 翻唱请求: ' + text,
        body: '**歌名:** ' + text + '\n**时间:** ' + new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'}),
        labels: ['翻唱请求']
      })
    }).then(function(r){
      if (r.ok) {
        reqToast.textContent = '✅ 「' + text + '」已提交！去 Issues 页查看所有请求';
      } else {
        reqToast.textContent = '⚠️ 提交失败，直接告诉制作人吧';
      }
      reqToast.classList.add('show');
    }).catch(function(){
      reqToast.textContent = '⚠️ 网络问题，直接告诉我即可';
      reqToast.classList.add('show');
    });
    
    reqInput.value = ''; reqBtn.disabled = false; reqBtn.textContent = '点歌';
    setTimeout(function(){ reqToast.classList.remove('show'); }, 5000);
  });
  reqInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') reqBtn.click(); });
})();
</script>
</body>
</html>
