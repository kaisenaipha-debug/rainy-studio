<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨棚唱片 · 翻唱作品集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Serif SC', serif;
  min-height: 100vh;
  background-image: radial-gradient(ellipse at 50% 0%, #1a1410 0%, #0a0a0a 60%);
  -webkit-tap-highlight-color: transparent;
}
.container { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
.header { text-align: center; margin-bottom: 40px; padding: 36px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.header h1 { font-size: 28px; font-weight: 700; letter-spacing: 4px; color: #fff; margin-bottom: 10px; }
.header .subtitle { font-size: 12px; color: #888; letter-spacing: 3px; font-weight: 300; }
.header .divider { width: 36px; height: 1px; background: linear-gradient(90deg, transparent, #555, transparent); margin: 14px auto; }
.header .count { font-size: 12px; color: #555; }

.song-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  margin-bottom: 14px;
  overflow: hidden;
  transition: all 0.2s;
}
.song-card:active { background: rgba(255,255,255,0.06); }

.song-link {
  display: flex;
  align-items: center;
  padding: 18px 20px;
  text-decoration: none;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}

.song-number {
  font-size: 11px;
  font-weight: 600;
  color: #555;
  width: 28px;
  flex-shrink: 0;
  font-family: -apple-system, sans-serif;
}

.song-cover {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  background: linear-gradient(135deg, #2a2018, #1a1410);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 14px;
  flex-shrink: 0;
  font-size: 18px;
  border: 1px solid rgba(255,255,255,0.06);
}

.song-info { flex: 1; min-width: 0; }
.song-title { font-size: 16px; font-weight: 600; color: #f0f0f0; margin-bottom: 3px; }
.song-artist { font-size: 12px; color: #666; }
.tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 8px;
  margin-left: 6px;
  vertical-align: middle;
}
.tag-cover { background: rgba(80, 160, 200, 0.12); color: #60a0c8; }
.tag-xichiang { background: rgba(200, 80, 80, 0.12); color: #e06060; }

.song-duration { font-size: 11px; color: #555; font-family: -apple-system, sans-serif; flex-shrink: 0; margin-left: 8px; }

.play-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-left: 10px;
  font-size: 14px;
  transition: all 0.2s;
}
.song-card:active .play-icon { background: rgba(255,255,255,0.12); }

.footer { text-align: center; margin-top: 40px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,0.04); }
.footer p { font-size: 11px; color: #444; letter-spacing: 1px; }

.tip {
  text-align: center;
  font-size: 12px;
  color: #555;
  margin-bottom: 20px;
  padding: 10px;
  background: rgba(255,255,255,0.02);
  border-radius: 8px;
  line-height: 1.6;
}

@media (max-width: 480px) {
  .container { padding: 24px 16px 60px; }
  .header h1 { font-size: 24px; }
  .song-link { padding: 14px 16px; }
}
</style>
</head>
<body>
